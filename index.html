<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Octo-pet · GitHub Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #e7e2d7;
    font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  #root {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  /* Tweaks panel */
  .tweaks-toggle {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 300;
    width: 44px;
    height: 44px;
    border-radius: 22px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    transition: transform 0.15s;
  }
  .tweaks-toggle:hover { transform: scale(1.05); }

  .tweaks-panel {
    position: fixed;
    bottom: 84px;
    right: 28px;
    z-index: 300;
    width: 270px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.08);
    border: 1px solid #eee;
    padding: 18px;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: #1a1a1a;
    transform-origin: bottom right;
    animation: panelIn 0.18s ease;
  }
  @keyframes panelIn {
    from { opacity: 0; transform: scale(0.92) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: #e8e3d8;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 7px;
    background: #1a1a1a;
    cursor: pointer;
  }
  select {
    width: 100%; padding: 7px 10px; border-radius: 8px;
    border: 1px solid #eee; background: #faf7f2;
    font-family: inherit; font-size: 13px; color: #1a1a1a;
    cursor: pointer;
  }

  @keyframes creatureWobble {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-3px) rotate(1deg); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="lib/ios-frame.jsx"></script>
<script type="text/babel" src="lib/data.jsx"></script>
<script type="text/babel" src="lib/ui.jsx"></script>
<script type="text/babel" src="lib/creature.jsx"></script>
<script type="text/babel" src="lib/creature-variants.jsx"></script>
<script type="text/babel" src="lib/screens.jsx"></script>

<script type="text/babel">
/* global React, ReactDOM,
   IOSDevice, TabBar,
   OnboardingScreen, HomeScreen, GoalsScreen, BadgesScreen, ProfileScreen,
   MOCK_USER, MOCK_STATS, generateContributionGrid,
   CreatureStages, Creature, PetByFamily, PetFamilies, TOKENS */

const grid = generateContributionGrid();

// ─── Tweaks panel ───────────────────────────────────────────
const DEFAULTS = {
  petFamily: 'octo',
  creatureStage: 'fledgling',
  creatureMood: 'happy',
  totalContributions: 342,
  currentStreak: 23,
};

function TweakRow({ label, children }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 11, fontWeight: 500, color: '#777', marginBottom: 5, letterSpacing: 0.2 }}>
        {label}
      </div>
      {children}
    </div>
  );
}

function TweaksPanel({ tweaks, update, onReplayOnboarding }) {
  return (
    <div className="tweaks-panel">
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14, display: 'flex', alignItems: 'center', gap: 7 }}>
        <div style={{ width: 7, height: 7, borderRadius: '50%', background: 'oklch(0.62 0.12 140)' }}/>
        Tweaks
      </div>

      <TweakRow label="Pet family">
        <div style={{ display: 'flex', gap: 5 }}>
          {PetFamilies.map(f => (
            <button key={f.id} onClick={() => update('petFamily', f.id)} style={{
              flex: 1, padding: '6px 2px', borderRadius: 8,
              border: '1px solid ' + (tweaks.petFamily === f.id ? '#1a1a1a' : '#eee'),
              background: tweaks.petFamily === f.id ? '#1a1a1a' : '#faf7f2',
              color: tweaks.petFamily === f.id ? '#fff' : '#1a1a1a',
              fontFamily: 'inherit', fontSize: 11, fontWeight: 600, cursor: 'pointer',
            }}>
              {f.id === 'slime' ? 'Slime' : f.id === 'robo' ? 'Robo' : 'Octo'}
            </button>
          ))}
        </div>
      </TweakRow>

      <TweakRow label="Stage">
        <select value={tweaks.creatureStage} onChange={e => update('creatureStage', e.target.value)}>
          {CreatureStages.map(s => (
            <option key={s.name} value={s.name}>{s.name} ({s.min}+)</option>
          ))}
        </select>
      </TweakRow>

      <TweakRow label="Mood">
        <select value={tweaks.creatureMood} onChange={e => update('creatureMood', e.target.value)}>
          {['happy','neutral','hungry','sleeping','excited'].map(m => (
            <option key={m} value={m}>{m}</option>
          ))}
        </select>
      </TweakRow>

      <TweakRow label={`Contributions · ${tweaks.totalContributions}`}>
        <input type="range" min="0" max="600" value={tweaks.totalContributions}
          onChange={e => update('totalContributions', +e.target.value)}/>
      </TweakRow>

      <TweakRow label={`Streak · ${tweaks.currentStreak}d`}>
        <input type="range" min="0" max="60" value={tweaks.currentStreak}
          onChange={e => update('currentStreak', +e.target.value)}/>
      </TweakRow>

      <button onClick={onReplayOnboarding} style={{
        width: '100%', padding: '8px 12px', marginTop: 2,
        border: '1px solid #eee', borderRadius: 8, background: '#faf7f2',
        fontFamily: 'inherit', fontSize: 12, cursor: 'pointer', color: '#777',
      }}>
        Replay onboarding
      </button>
    </div>
  );
}

// ─── Main app ───────────────────────────────────────────────
function App() {
  const [tab, setTab] = React.useState('home');
  const [onboarded, setOnboarded] = React.useState(false);
  const [tweaks, setTweaks] = React.useState(DEFAULTS);
  const [showTweaks, setShowTweaks] = React.useState(false);

  const update = (key, val) => setTweaks(t => ({ ...t, [key]: val }));

  const state = {
    family: tweaks.petFamily,
    stage: tweaks.creatureStage,
    mood: tweaks.creatureMood,
    stats: {
      ...MOCK_STATS,
      totalContributions: tweaks.totalContributions,
      currentStreak: tweaks.currentStreak,
    },
  };

  const screen = !onboarded
    ? <OnboardingScreen family={tweaks.petFamily} onComplete={() => setOnboarded(true)}/>
    : tab === 'home'    ? <HomeScreen state={state} grid={grid}/>
    : tab === 'goals'   ? <GoalsScreen stats={state.stats}/>
    : tab === 'badges'  ? <BadgesScreen/>
    : tab === 'profile' ? <ProfileScreen state={state} grid={grid}/>
    : null;

  return (
    <>
      <IOSDevice width={390} height={844}>
        <div style={{ position: 'relative', height: '100%', overflow: 'hidden' }}>
          {screen}
          {onboarded && <TabBar active={tab} onChange={setTab}/>}
        </div>
      </IOSDevice>

      {/* Tweaks toggle */}
      <button className="tweaks-toggle" onClick={() => setShowTweaks(v => !v)} title="Tweaks">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4 12H2M22 12h-2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>
        </svg>
      </button>

      {showTweaks && (
        <TweaksPanel tweaks={tweaks} update={update} onReplayOnboarding={() => { setOnboarded(false); setShowTweaks(false); }}/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
